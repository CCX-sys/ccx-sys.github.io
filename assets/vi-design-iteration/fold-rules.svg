<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" lang="zh-CN" role="img"><title>折页演示的设计元素、方法与适用规则</title><style>text{font-family:Arial,"Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f1ecdd"/><text x="64" y="76" font-size="44" fill="#253d36" font-weight="400">《折页》：把视觉语言整理为调用规则</text><text x="64" y="124" font-size="25" fill="#52766a" font-weight="400">从元素、组织方法到比较条件，分别说明保留什么、替换什么。</text><path d="M64 178H1536" stroke="#c7c9b8"/><text x="64" y="232" font-size="30" fill="#843c3c" font-weight="400">纸色、宋体与酒红</text><text x="620" y="232" font-size="31" fill="#253d36" font-weight="400">用阅读语言建立整体气质</text><text x="620" y="283" font-size="24" fill="#52766a" font-weight="400">重点色用于路径与差异，字体与留白服务读序。</text><path d="M64 348H1536" stroke="#c7c9b8"/><text x="64" y="402" font-size="30" fill="#843c3c" font-weight="400">书页母题贯穿内容</text><text x="620" y="402" font-size="31" fill="#253d36" font-weight="400">让核心对象承担展开与解释</text><text x="620" y="453" font-size="24" fill="#52766a" font-weight="400">模型进入内页，曲线连接观察，收尾延续同一对象。</text><path d="M64 518H1536" stroke="#c7c9b8"/><text x="64" y="572" font-size="30" fill="#843c3c" font-weight="400">同一基准下比较</text><text x="620" y="572" font-size="31" fill="#253d36" font-weight="400">把真实变化放到同一页</text><text x="620" y="623" font-size="24" fill="#52766a" font-weight="400">保留视角与尺度，更换项目时同步图证和保持项。</text><path d="M64 701H1536" stroke="#c7c9b8"/><text x="64" y="753" font-size="27" fill="#52766a" font-weight="400">适用：空间与设计提案演示</text><text x="64" y="801" font-size="27" fill="#253d36" font-weight="400">可替换：项目对象、文字和图证</text><text x="64" y="849" font-size="27" fill="#253d36" font-weight="400">需保留：母题连续、阅读关系与比较基准</text></svg>